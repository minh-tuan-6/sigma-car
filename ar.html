<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="robots" content="noindex">
  <title>Xem AR — SIGMACAR</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <link rel="stylesheet" href="/css/ar.css?v=2.0">
  <script type="importmap">
    {
      "imports": {
        "three": "/js/vendor/three/three.module.min.js",
        "three/addons/": "/js/vendor/three/addons/"
      }
    }
  </script>
  <script type="module" src="/js/ar/ar-app.js?v=2.0"></script>
</head>
<body>
  <!--
    Dedicated AR page (/ar/:vehicleId). The canvas is a full-screen 3D view of the vehicle (not a camera).
    The AR camera itself is Apple AR Quick Look (native ARKit), opened from #ar-launch on iPhone / iPad.
  -->
  <main id="ar-root" class="ar-root" data-state="boot">
    <div id="ar-stage" class="ar-stage" aria-hidden="true"></div>

    <a id="ar-close" class="ar-close" href="/" aria-label="Đóng và quay lại showroom">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </a>

    <section id="ar-status" class="ar-status" role="status" aria-live="polite">
      <p id="ar-status-title" class="ar-status__title">Đang tải…</p>
      <p id="ar-status-detail" class="ar-status__detail"></p>
      <div id="ar-progress" class="ar-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden>
        <div id="ar-progress-bar" class="ar-progress__bar"></div>
      </div>
      <button id="ar-retry" class="ar-retry" type="button" hidden>Thử lại</button>
    </section>

    <section id="ar-notice" class="ar-notice" role="note" hidden>
      <p id="ar-notice-text" class="ar-notice__text"></p>
      <div id="ar-qr-wrap" class="ar-qr" hidden>
        <div id="ar-qr" class="ar-qr__code"></div>
      </div>
    </section>

    <footer id="ar-dock" class="ar-dock">
      <p id="ar-color-name" class="ar-color-name" hidden></p>
      <div id="ar-colors" class="ar-swatches" role="radiogroup" aria-label="Màu xe" hidden></div>
      <button id="ar-launch" class="ar-launch" type="button" data-state="hidden" hidden disabled>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 2.8l8 4.6v9.2l-8 4.6-8-4.6V7.4z M12 2.8v18.4 M4 7.4l8 4.6 8-4.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        <span id="ar-launch-label">Xem AR</span>
      </button>
      <p id="ar-launch-note" class="ar-launch-note" hidden></p>
    </footer>
  </main>
  <noscript>
    <p style="padding:24px;font-family:sans-serif">Trang AR cần JavaScript. <a href="/">Quay lại SIGMACAR</a></p>
  </noscript>
</body>
</html>

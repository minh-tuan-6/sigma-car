<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B1220">
  <meta name="robots" content="noindex">
  <title>Xem AR — SIGMACAR</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <link rel="stylesheet" href="/css/ar.css?v=1.0">
  <script type="importmap">
    {
      "imports": {
        "three": "/js/vendor/three/three.module.min.js",
        "three/addons/": "/js/vendor/three/addons/"
      }
    }
  </script>
  <script type="module" src="/js/ar/ar-app.js?v=1.0"></script>
</head>
<body>
  <main id="ar-root" class="ar-root" data-state="boot" data-xr="off" data-mode="">
    <!-- WebGL canvas (3D preview). During WebXR the system compositor shows the real camera feed. -->
    <div id="ar-stage" class="ar-stage" aria-hidden="true"></div>

    <!-- WebXR dom-overlay root: everything visible during the AR session lives in here. -->
    <div id="ar-overlay" class="ar-overlay">
      <div id="ar-hotspot-layer" class="ar-hotspot-layer"></div>

      <header class="ar-topbar" id="ar-topbar">
        <a id="ar-back" class="ar-btn ar-btn--icon" href="/" aria-label="Quay lại Showroom">
          <span aria-hidden="true">←</span>
        </a>
        <div class="ar-title">
          <h1 id="ar-vehicle-name">Đang tải…</h1>
          <p id="ar-config-summary" class="ar-subtitle"></p>
        </div>
        <span id="ar-mode-badge" class="ar-badge" hidden></span>
        <button id="ar-exit-xr" class="ar-btn ar-btn--ghost" type="button" hidden>Thoát AR</button>
      </header>

      <!-- Loading / status / error card -->
      <section id="ar-status" class="ar-card ar-status" role="status" aria-live="polite">
        <div id="ar-status-icon" class="ar-status__icon" aria-hidden="true">⏳</div>
        <p id="ar-status-title" class="ar-status__title">Đang khởi tạo…</p>
        <p id="ar-status-detail" class="ar-status__detail"></p>
        <div id="ar-progress" class="ar-progress" hidden>
          <div id="ar-progress-bar" class="ar-progress__bar" style="width:0%"></div>
        </div>
        <div class="ar-status__actions">
          <button id="ar-retry" class="ar-btn ar-btn--primary" type="button" hidden>Thử lại</button>
        </div>
      </section>

      <!-- Scanning instructions (XR) -->
      <p id="ar-hint" class="ar-hint" hidden></p>

      <!-- Non-WebXR explanation + native AR launchers + QR hand-off -->
      <section id="ar-fallback" class="ar-card ar-fallback" hidden>
        <p id="ar-fallback-text" class="ar-fallback__text"></p>
        <div class="ar-fallback__actions">
          <button id="ar-open-scene-viewer" class="ar-btn ar-btn--primary" type="button" hidden>Mở AR bằng Google Scene Viewer</button>
          <button id="ar-open-quick-look" class="ar-btn ar-btn--primary" type="button" hidden>Mở AR Quick Look</button>
        </div>
        <div id="ar-qr-wrap" class="ar-qr" hidden>
          <div id="ar-qr" class="ar-qr__code"></div>
          <p class="ar-qr__caption">Quét bằng điện thoại Android (Chrome) để xem AR thật tại không gian của bạn.</p>
        </div>
      </section>

      <!-- Hotspot / component info -->
      <aside id="ar-info" class="ar-card ar-info" hidden>
        <button id="ar-info-close" class="ar-btn ar-btn--icon ar-info__close" type="button" aria-label="Đóng">✕</button>
        <p id="ar-info-category" class="ar-info__category"></p>
        <h2 id="ar-info-title" class="ar-info__title"></h2>
        <p id="ar-info-body" class="ar-info__body"></p>
      </aside>

      <!-- Configuration sheet -->
      <section id="ar-sheet" class="ar-card ar-sheet" hidden>
        <div class="ar-sheet__group" id="ar-colors-group">
          <h3>Màu sơn</h3>
          <div id="ar-colors" class="ar-swatches" role="radiogroup" aria-label="Màu sơn"></div>
          <p id="ar-colors-note" class="ar-note" hidden></p>
        </div>
        <div class="ar-sheet__group" id="ar-wheels-group">
          <h3>Mâm xe <span class="ar-note-inline">(lớp hoàn thiện)</span></h3>
          <div id="ar-wheels" class="ar-chips" role="radiogroup" aria-label="Mâm xe"></div>
          <p id="ar-wheels-note" class="ar-note" hidden></p>
        </div>
        <div class="ar-sheet__cta">
          <span id="ar-price" class="ar-price"></span>
          <a id="ar-checkout" class="ar-btn ar-btn--primary" href="/">Đặt cọc / Báo giá</a>
        </div>
      </section>

      <footer class="ar-dock" id="ar-dock">
        <div class="ar-dock__row ar-dock__secondary">
          <button id="ar-btn-config" class="ar-btn ar-btn--chip" type="button" aria-expanded="false" aria-controls="ar-sheet" disabled>🎨 Cấu hình</button>
          <button id="ar-btn-doors" class="ar-btn ar-btn--chip" type="button" hidden>🚪 Mở cửa</button>
          <button id="ar-btn-move" class="ar-btn ar-btn--chip" type="button" hidden>✥ Di chuyển</button>
          <button id="ar-btn-reset" class="ar-btn ar-btn--chip" type="button" hidden>↺ Đặt lại</button>
          <button id="ar-btn-capture" class="ar-btn ar-btn--chip" type="button" hidden>📸 Chụp ảnh</button>
          <button id="ar-btn-hotspots" class="ar-btn ar-btn--chip" type="button" hidden aria-pressed="true">ⓘ Điểm nổi bật</button>
        </div>
        <button id="ar-primary" class="ar-btn ar-btn--primary ar-btn--wide" type="button" disabled>Đang tải…</button>
      </footer>

      <details id="ar-diagnostics" class="ar-diagnostics">
        <summary>Chẩn đoán</summary>
        <pre id="ar-diagnostics-body"></pre>
      </details>
    </div>
  </main>
  <noscript>
    <p style="padding:24px;font-family:sans-serif">Trang AR cần JavaScript. <a href="/">Quay lại SIGMACAR</a></p>
  </noscript>
</body>
</html>

name: SIGMACAR CI Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Dev dependencies are required: the AR engine tests import the pinned three.js vendored in js/vendor/
      - name: Install dependencies
        run: npm ci

      - name: Syntax check core JS files
        run: |
          node --check server.js
          node --check backend/api/router.js
          node --check js/api-client.js
          node --check js/app.js
          node --check "functions/api/v1/[[path]].js"
          node --check backend/cloudflare/runtime.js
          node --check scripts/d1/json-to-d1.js
          for f in $(find js/ar -name "*.js"); do node --check "$f"; done

      - name: Data integrity audit
        run: node scripts/audit-data-integrity.js

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Run Integration Tests (Isolated Ephemeral Server)
        run: npm run test:integration

      - name: Run Security Tests
        run: npm run test:security

      # Same integration + security suites, served by the Cloudflare Worker runtime with D1 persistence (node:sqlite shim)
      - name: Run suites through the Workers runtime (D1 driver)
        run: npm run test:worker-runtime

      - name: Worker bundle check (no deploy)
        run: npx wrangler deploy -c wrangler.api.toml --env production --dry-run --outdir .d1-migration/bundle
        env:
          WRANGLER_SEND_METRICS: 'false'

      - name: Verify SQL Migration Dry-Run
        run: node scripts/migrate-json-to-sql.js --dry-run

      - name: Build static dist bundle & verify no secret leaks
        run: npm run build
